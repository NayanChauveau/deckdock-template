name: Deck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --locked

      - run: uv run --locked pytest -q

      - name: Set deck version
        run: echo "DECKDOCK_VERSION=$(date -u +%Y-%m-%dT%H:%M:%SZ)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Compile the deck
        run: uv run --locked compile

      - uses: NayanChauveau/deckdock/action@v2
        with:
          command: check
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: deck
          path: dist/

      # Available with the DeckDock hub (project 2): add the DECKDOCK_TOKEN secret, then uncomment.
