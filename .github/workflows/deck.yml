name: Deck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DECKDOCK_TOKEN: ${{ secrets.DECKDOCK_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --locked

      - run: uv run --locked pytest -q

      - name: Set deck version
        id: version
        run: |
          version="$(date -u +%Y-%m-%dT%H:%M:%SZ)+${GITHUB_SHA::7}"
          echo "DECKDOCK_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compile the deck
        run: uv run --locked compile

      - uses: NayanChauveau/deckdock/action@v2
        with:
          command: check
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: deck
          path: dist/

      - name: Publish to DeckDock hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DECKDOCK_TOKEN != '' && vars.DECKDOCK_HUB_URL != ''
        uses: NayanChauveau/deckdock/action@v2
        with:
          command: publish
          path: dist
          hub-url: ${{ vars.DECKDOCK_HUB_URL }}

  # After each push to main, the `dist` branch holds the compiled deck (index.json at its root).
  publish-dist:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deck
          path: dist

      - name: Write index.json
        run: python3 scripts/make_index.py dist

      - name: Push dist to the dist branch
        working-directory: dist
        env:
          DECKDOCK_VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        run: |
          git init -q
          git checkout -q --orphan dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${DECKDOCK_VERSION}"
          git push --force "https://x-access-token:${GITHUB_TOKEN_VALUE}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/dist
