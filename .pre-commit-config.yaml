repos:
  - repo: local
    hooks:
      - id: deckdock-validate
        name: deckdock validate
        entry: uvx --from git+https://github.com/NayanChauveau/deckdock@v1#subdirectory=cli deckdock validate
        language: system
        pass_filenames: false
        files: ^(deckdock\.yaml|cards/|media/)
