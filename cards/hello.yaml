# yaml-language-server: $schema=https://raw.githubusercontent.com/NayanChauveau/deckdock/v1/spec/deckdock-source-1.schema.json

cards:
  - id: hello-001
    type: basic
    tags: [hello]
    fr:
      front: "Que montre cette image ?\n\n![Un carré dégradé](media/hello.png)"
      back: Un carré dégradé, l'image d'exemple du modèle.
    en:
      front: "What does this image show?\n\n![A gradient square](media/hello.png)"
      back: A gradient square, the template's example image.

  - id: hello-002
    type: cloze
    tags: [hello]
    fr:
      text: "Les decks DeckDock sont écrits en {{c1::YAML}}."
      extra: Un fichier par thème, dans le dossier `cards/`.
    en:
      text: "DeckDock decks are written in {{c1::YAML}}."
      extra: One file per topic, in the `cards/` folder.

  - id: hello-003
    type: mcq
    tags: [hello]
    fr:
      question: Quel dossier contient les fichiers de cartes ?
      choices:
        - {text: "cards/", correct: true}
        - {text: "media/"}
        - {text: "dist/"}
      explanation: Les cartes vont dans `cards/`, les images dans `media/`. `dist/` est généré par le build.
    en:
      question: Which folder holds the card files?
      choices:
        - {text: "cards/", correct: true}
        - {text: "media/"}
        - {text: "dist/"}
      explanation: Cards go in `cards/`, images in `media/`. `dist/` is generated by the build.
